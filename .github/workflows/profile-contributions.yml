name: Update profile contributions

on:
  schedule:
    - cron: "17 1 * * *" # 09:17 China Standard Time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contributions

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=%231a7f37
            dist/snake-dark.svg?palette=github-dark&color_snake=%2356d364

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Prepare profile images
        shell: bash
        run: |
          cp profile-3d-contrib/profile-season.svg dist/island-light.svg
          cp profile-3d-contrib/profile-night-rainbow.svg dist/island-dark.svg
          for file in dist/snake-{light,dark}.svg; do
            grep -q '</style>' "$file"
            sed -i 's|</style>|@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>|' "$file"
          done

      - name: Publish images to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
